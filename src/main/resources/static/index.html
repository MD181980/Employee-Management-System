<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Employee Management System</h1>
    <p>Java • Spring Boot • MySQL</p>
</header>

<main>
    <section class="card">
        <h2 id="formTitle">Add Employee</h2>
        <form id="employeeForm">
            <input type="hidden" id="employeeId">

            <label>Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Department</label>
            <input type="text" id="department" required>

            <label>Salary</label>
            <input type="number" id="salary" min="0" step="0.01" required>

            <button type="submit">Save Employee</button>
            <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
        </form>
    </section>

    <section class="card">
        <div class="table-header">
            <h2>Employee List</h2>
            <button onclick="loadEmployees()">Refresh</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
